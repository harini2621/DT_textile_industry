<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{register.title}">Register | TRIZEN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-page">

<div class="container-fluid">
    <div class="row min-vh-100">

        <!-- Left Panel -->
        <div class="col-lg-6 d-none d-lg-flex align-items-center justify-content-center login-left-panel">
            <div class="text-center text-white px-5">
                <i class="bi bi-boxes display-1 mb-3"></i>
                <h1 class="display-4 fw-bold">TRIZEN</h1>
                <h4 class="mt-2" th:text="#{register.left.title}">Smart Textile Management System</h4>
                <p class="lead mt-3 opacity-75" th:text="#{register.left.desc}">Create your account and manage textile production efficiently.</p>
                <img src="https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=800"
                     class="img-fluid rounded-4 shadow-lg mt-4" th:alt="#{img.alt.textile}" alt="Textile" style="max-height:300px;object-fit:cover;">
            </div>
        </div>

        <!-- Register Card -->
        <div class="col-lg-6 d-flex align-items-center justify-content-center bg-white">
            <div class="w-100 px-4 px-md-5" style="max-width:520px;">

                <!-- Language selector -->
                <div class="d-flex justify-content-end mb-3">
                    <div class="dropdown">
                        <button class="btn btn-sm btn-outline-secondary dropdown-toggle rounded-pill fw-semibold" type="button" data-bs-toggle="dropdown">
                            <i class="bi bi-translate me-1"></i><span th:text="${#locale.language == 'ta'} ? #{lang.ta} : #{lang.en}">English</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="?lang=en" th:text="#{lang.en}">English</a></li>
                            <li><a class="dropdown-item" href="?lang=ta" th:text="#{lang.ta}">தமிழ்</a></li>
                        </ul>
                    </div>
                </div>


                <div class="text-center mb-4">
                    <i class="bi bi-person-plus-fill display-3 text-primary"></i>
                    <h2 class="fw-bold mt-2" th:text="#{register.heading}">Create Account</h2>
                    <p class="text-muted" th:text="#{register.sub}">Register to access TRIZEN</p>
                </div>

                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <form th:action="@{/register}" th:object="${user}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="mb-3">
                        <label class="form-label fw-semibold" th:text="#{register.fullname}">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                            <input type="text" class="form-control" th:field="*{fullName}"
                                   th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                                   th:placeholder="#{register.fullname.placeholder}" placeholder="Enter full name" required>
                        </div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold" th:text="#{register.email}">Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                            <input type="email" class="form-control" th:field="*{email}"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                   th:placeholder="#{register.email.placeholder}" placeholder="Enter email" required>
                        </div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold" th:text="#{field.username}">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-at"></i></span>
                            <input type="text" class="form-control" th:field="*{username}"
                                   th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''"
                                   th:placeholder="#{register.username.placeholder}" placeholder="Choose username" required>
                        </div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold" th:text="#{field.password}">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" class="form-control" th:field="*{password}"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                                   th:placeholder="#{register.password.placeholder}" placeholder="Enter password (min 6 chars)" required minlength="6">
                        </div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold" th:text="#{register.role}">Role</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-shield-fill"></i></span>
                            <select class="form-select" th:field="*{role}"
                                    th:classappend="${#fields.hasErrors('role')} ? 'is-invalid' : ''" required>
                                <option value="" th:text="#{register.select.role}">Select Role</option>
                                <option value="OWNER" th:text="#{register.option.owner}">Owner</option>
                                <option value="WORKER" th:text="#{register.option.worker}">Worker</option>
                            </select>
                        </div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-semibold">
                            <i class="bi bi-person-plus-fill me-2"></i><span th:text="#{register.button}">Register</span>
                        </button>
                    </div>

                    <div class="text-center">
                        <span class="text-muted" th:text="#{register.have.account}">Already have an account?</span>
                        <a href="/login" class="fw-bold text-decoration-none ms-1" th:text="#{register.login}">Login</a>
                    </div>
                </form>

                <div class="text-center mt-4">
                    <small class="text-muted" th:text="#{register.footer}">&copy; 2026 TRIZEN Textile Management System</small>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
