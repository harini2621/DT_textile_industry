<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{error.title}">Error | TRIZEN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
<div class="text-center p-5">
<div class="position-absolute top-0 end-0 p-3">
    <div class="dropdown">
        <button class="btn btn-sm btn-outline-secondary dropdown-toggle rounded-pill fw-semibold" type="button" data-bs-toggle="dropdown">
            <i class="bi bi-translate me-1"></i><span th:text="${#locale.language == 'ta'} ? #{lang.ta} : #{lang.en}">English</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="?lang=en" th:text="#{lang.en}">English</a></li>
            <li><a class="dropdown-item" href="?lang=ta" th:text="#{lang.ta}">தமிழ்</a></li>
        </ul>
    </div>
</div>
    <i class="bi bi-exclamation-triangle-fill display-1 text-danger"></i>
    <h1 class="mt-3 fw-bold" th:text="#{error.heading}">Something went wrong</h1>
    <p class="text-muted mt-2" th:text="${errorMessage != null ? errorMessage : #messages.msg('error.message.default')}"></p>
    <a href="/" class="btn btn-primary rounded-pill mt-3 px-4">
        <i class="bi bi-house-fill me-2"></i><span th:text="#{error.go.home}">Go Home</span>
    </a>
    <a href="javascript:history.back()" class="btn btn-outline-secondary rounded-pill mt-3 px-4 ms-2">
        <i class="bi bi-arrow-left me-2"></i><span th:text="#{error.go.back}">Go Back</span>
    </a>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
