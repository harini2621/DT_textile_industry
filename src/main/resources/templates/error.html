<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Error | TRIZEN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
<div class="text-center p-5">
    <i class="bi bi-exclamation-triangle-fill display-1 text-danger"></i>
    <h1 class="mt-3 fw-bold">Something went wrong</h1>
    <p class="text-muted mt-2" th:text="${errorMessage != null ? errorMessage : 'An unexpected error occurred.'}"></p>
    <a href="/" class="btn btn-primary rounded-pill mt-3 px-4">
        <i class="bi bi-house-fill me-2"></i>Go Home
    </a>
    <a href="javascript:history.back()" class="btn btn-outline-secondary rounded-pill mt-3 px-4 ms-2">
        <i class="bi bi-arrow-left me-2"></i>Go Back
    </a>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
