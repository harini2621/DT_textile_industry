<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workers | TRIZEN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="wrapper">
    <aside class="sidebar">
        <div class="logo"><i class="bi bi-boxes"></i><span>TRIZEN</span></div>
        <ul>
            <li><a href="/owner-dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
            <li><a href="/workers" class="active"><i class="bi bi-people-fill"></i> Workers</a></li>
            <li><a href="/owner-orders"><i class="bi bi-cart-check-fill"></i> Orders</a></li>
            <li><a href="/owner-search"><i class="bi bi-search"></i> Search Stock</a></li>
            <li><a href="/reports"><i class="bi bi-bar-chart-fill"></i> Reports</a></li>
            <li><a href="/profile"><i class="bi bi-person-circle"></i> Profile</a></li>
            <li>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-link sidebar-logout"><i class="bi bi-box-arrow-right"></i> Logout</button>
                </form>
            </li>
        </ul>
    </aside>

    <main class="main-content">
        <div class="topbar">
            <div>
                <h2>Workers Management</h2>
                <small>Manage employee details and monitor workforce.</small>
            </div>
        </div>

        <!-- Stats -->
        <div class="row g-4">
            <div class="col-lg-3 col-md-6">
                <div class="dashboard-card">
                    <i class="bi bi-people-fill icon blue"></i>
                    <h3 th:text="${totalWorkers}">0</h3>
                    <p>Total Workers</p>
                </div>
            </div>
            <div class="col-lg-3 col-md-6">
                <div class="dashboard-card">
                    <i class="bi bi-person-check-fill icon green"></i>
                    <h3 th:text="${availableWorkers}">0</h3>
                    <p>Available</p>
                </div>
            </div>
            <div class="col-lg-3 col-md-6">
                <div class="dashboard-card">
                    <i class="bi bi-person-workspace icon warning"></i>
                    <h3 th:text="${busyWorkers}">0</h3>
                    <p>Busy</p>
                </div>
            </div>
            <div class="col-lg-3 col-md-6">
                <div class="dashboard-card">
                    <i class="bi bi-person-x-fill icon red"></i>
                    <h3 th:text="${totalWorkers - availableWorkers - busyWorkers < 0 ? 0 : totalWorkers - availableWorkers - busyWorkers}">0</h3>
                    <p>Other</p>
                </div>
            </div>
        </div>

        <!-- Workers Table -->
        <div class="glass-card p-4 mt-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold mb-0">Workers List</h5>
                <input type="text" id="workerSearch" class="form-control w-25"
                       placeholder="Search worker..." onkeyup="filterTable()">
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle" id="workerTable">
                    <thead class="table-light">
                        <tr>
                            <th>#</th><th>Name</th><th>Skill</th>
                            <th>Department</th><th>Phone</th><th>Availability</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="w : ${workers}">
                            <td th:text="${w.workerId}"></td>
                            <td th:text="${w.workerName}"></td>
                            <td th:text="${w.skill}"></td>
                            <td th:text="${w.department}"></td>
                            <td th:text="${w.phoneNumber}"></td>
                            <td>
                                <span th:classappend="${w.availability == 'Available'} ? 'bg-success' :
                                                      (${w.availability == 'Busy'} ? 'bg-warning text-dark' : 'bg-secondary')"
                                      class="badge" th:text="${w.availability}"></span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(workers)}">
                            <td colspan="6" class="text-center text-muted py-5">
                                <i class="bi bi-people display-5 d-block mb-2"></i>No workers registered yet.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function filterTable() {
        const input = document.getElementById('workerSearch').value.toLowerCase();
        document.querySelectorAll('#workerTable tbody tr').forEach(row => {
            row.style.display = row.textContent.toLowerCase().includes(input) ? '' : 'none';
        });
    }
</script>
</body>
</html>
