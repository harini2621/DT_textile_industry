# =====================================
# APPLICATION
# =====================================
spring.application.name=smart-textile-tracking-system

# =====================================
# DATABASE CONFIGURATION
# =====================================
spring.datasource.url=jdbc:mysql://localhost:3306/smart_textile_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Hema.0111
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================
# JPA / HIBERNATE
# =====================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# =====================================
# THYMELEAF
# =====================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# =====================================
# SERVER
# =====================================
server.port=8090

# =====================================
# SESSION
# =====================================
server.servlet.session.timeout=30m
