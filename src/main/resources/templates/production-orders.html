<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Production Orders | TRIZEN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="wrapper">
    <aside class="sidebar">
        <div class="logo"><i class="bi bi-boxes"></i><span>TRIZEN</span></div>
        <ul>
            <li><a href="/worker-dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
            <li><a href="/production-orders" class="active"><i class="bi bi-clipboard-check"></i> Production Orders</a></li>
            <li><a href="/worker-stock"><i class="bi bi-box-seam"></i> Stock</a></li>
            <li><a href="/tasks"><i class="bi bi-list-task"></i> Tasks</a></li>
            <li><a href="/profile"><i class="bi bi-person-circle"></i> Profile</a></li>
            <li>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-link sidebar-logout"><i class="bi bi-box-arrow-right"></i> Logout</button>
                </form>
            </li>
        </ul>
    </aside>

    <main class="main-content">
        <div class="topbar">
            <div>
                <h2>Production Orders</h2>
                <small>Manage assigned production work efficiently.</small>
            </div>
        </div>

        <!-- Stats -->
        <div class="row g-4">
            <div class="col-lg-3 col-md-6">
                <div class="dashboard-card">
                    <i class="bi bi-list-task icon blue"></i>
                    <h3 th:text="${totalOrders}">0</h3>
                    <p>Total Orders</p>
                </div>
            </div>
            <div class="col-lg-3 col-md-6">
                <div class="dashboard-card">
                    <i class="bi bi-hourglass-split icon warning"></i>
                    <h3 th:text="${inProgressOrders}">0</h3>
                    <p>In Progress</p>
                </div>
            </div>
            <div class="col-lg-3 col-md-6">
                <div class="dashboard-card">
                    <i class="bi bi-check-circle-fill icon green"></i>
                    <h3 th:text="${completedOrders}">0</h3>
                    <p>Completed</p>
                </div>
            </div>
            <div class="col-lg-3 col-md-6">
                <div class="dashboard-card">
                    <i class="bi bi-clock-history icon purple"></i>
                    <h3 th:text="${pendingOrders}">0</h3>
                    <p>Pending</p>
                </div>
            </div>
        </div>

        <!-- Table -->
        <div class="glass-card p-4 mt-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold mb-0">Production Orders</h5>
                <input type="text" id="poSearch" class="form-control w-25"
                       placeholder="Search..." onkeyup="filterTable()">
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle" id="poTable">
                    <thead class="table-light">
                        <tr>
                            <th>#</th><th>Order No.</th><th>Product</th>
                            <th>Quantity</th><th>Deadline</th><th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="po : ${productionOrders}">
                            <td th:text="${po.orderId}"></td>
                            <td th:text="${po.orderNumber}"></td>
                            <td th:text="${po.productName}"></td>
                            <td th:text="${po.quantity}"></td>
                            <td th:text="${po.deadline}"></td>
                            <td>
                                <span th:classappend="${po.status == 'Completed'} ? 'bg-success' :
                                                      (${po.status == 'In Progress'} ? 'bg-warning text-dark' :
                                                      (${po.status == 'Pending'} ? 'bg-secondary' : 'bg-info'))"
                                      class="badge" th:text="${po.status}"></span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(productionOrders)}">
                            <td colspan="6" class="text-center text-muted py-5">
                                <i class="bi bi-inbox display-5 d-block mb-2"></i>No production orders found.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function filterTable() {
        const input = document.getElementById('poSearch').value.toLowerCase();
        document.querySelectorAll('#poTable tbody tr').forEach(row => {
            row.style.display = row.textContent.toLowerCase().includes(input) ? '' : 'none';
        });
    }
</script>
</body>
</html>
