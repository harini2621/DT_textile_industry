<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login | TRIZEN</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body class="login-page">

<div class="container-fluid">

    <div class="row min-vh-100">

        <!-- Left Side -->

        <div class="col-lg-6 d-none d-lg-flex
                    align-items-center
                    justify-content-center">

            <div class="text-center text-white">

                <h1 class="display-3 fw-bold">
                    TRIZEN
                </h1>

                <h3 class="mt-3">
                    Textile Management System
                </h3>

                <p class="lead mt-4">
                    Smart Inventory • Production • Orders • Analytics
                </p>

                <img src="https://images.unsplash.com/photo-1520607162513-77705c0f0d4a?w=900"
                     class="img-fluid rounded-5 shadow-lg mt-4"
                     alt="Textile">

            </div>

        </div>

        <!-- Login Card -->

        <div class="col-lg-6
                    d-flex
                    align-items-center
                    justify-content-center">

            <div class="glass-card login-card p-5">

                <div class="text-center mb-5">

                    <i class="bi bi-boxes display-2 text-primary"></i>

                    <h2 class="fw-bold mt-3">
                        Welcome Back
                    </h2>

                    <p class="text-muted">
                        Login to continue to TRIZEN
                    </p>

                </div>

                <!-- Error Message -->

                <div th:if="${error}" class="alert alert-danger">
                    <span th:text="${error}"></span>
                </div>

                <form th:action="@{/login}" method="post">

                    <!-- CHANGED: Username -->

                    <div class="mb-4">

                        <label class="form-label">
                            Username
                        </label>

                        <input type="text"
                               class="form-control"
                               name="username"
                               placeholder="Enter username"
                               required>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            Password
                        </label>

                        <input type="password"
                               class="form-control"
                               name="password"
                               placeholder="Enter password"
                               required>

                    </div>

                    <!-- ADDED: Role -->

                    <div class="mb-4">

                        <label class="form-label">
                            Role
                        </label>

                        <select
                                class="form-select"
                                name="role"
                                required>

                            <option value="">Select Role</option>
                            <option value="OWNER">Owner</option>
                            <option value="WORKER">Worker</option>

                        </select>

                    </div>

                    <div class="d-flex
                                justify-content-between
                                align-items-center
                                mb-4">

                        <div class="form-check">

                            <input class="form-check-input"
                                   type="checkbox"
                                   id="rememberMe">

                            <label class="form-check-label"
                                   for="rememberMe">

                                Remember Me

                            </label>

                        </div>

                        <a href="/forgot-password"
                           class="text-decoration-none">

                            Forgot Password?

                        </a>

                    </div>

                    <div class="d-grid mb-4">

                        <button type="submit"
                                class="btn btn-primary btn-lg rounded-pill">

                            <i class="bi bi-box-arrow-in-right"></i>

                            Login

                        </button>

                    </div>

                    <div class="text-center">

                        <span class="text-muted">
                            Don't have an account?
                        </span>

                        <a href="/register"
                           class="fw-bold text-decoration-none ms-1">

                            Register

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

<!-- Footer -->

<div class="text-center mt-5">

    <small class="text-muted">

        © 2026 TRIZEN Textile Management System.
        All Rights Reserved.

    </small>

</div>

<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom JS -->

<script th:src="@{/js/script.js}"></script>

</body>
</html>
