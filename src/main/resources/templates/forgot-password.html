<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password | TRIZEN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-page">

<div class="container-fluid">
    <div class="row min-vh-100">

        <!-- Left Panel -->
        <div class="col-lg-6 d-none d-lg-flex align-items-center justify-content-center login-left-panel">
            <div class="text-center text-white px-5">
                <i class="bi bi-shield-lock-fill display-1 mb-3"></i>
                <h1 class="display-4 fw-bold">TRIZEN</h1>
                <h4 class="mt-2">Password Recovery</h4>
                <p class="lead mt-3 opacity-75">Reset your password using your registered email address.</p>
            </div>
        </div>

        <!-- Form Card -->
        <div class="col-lg-6 d-flex align-items-center justify-content-center bg-white">
            <div class="w-100 px-4 px-md-5" style="max-width:480px;">

                <div class="text-center mb-4">
                    <i class="bi bi-key-fill display-3 text-warning"></i>
                    <h2 class="fw-bold mt-2">Reset Password</h2>
                    <p class="text-muted">Enter your registered email and set a new password.</p>
                </div>

                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <form th:action="@{/forgot-password}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Registered Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                            <input type="email" class="form-control form-control-lg"
                                   name="email" placeholder="Enter registered email" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">New Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" class="form-control form-control-lg"
                                   name="newPassword" placeholder="Enter new password" required minlength="6">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Confirm New Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" class="form-control form-control-lg"
                                   name="confirmPassword" placeholder="Confirm new password" required minlength="6">
                        </div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-warning btn-lg rounded-pill fw-semibold">
                            <i class="bi bi-arrow-repeat me-2"></i>Reset Password
                        </button>
                    </div>

                    <div class="text-center">
                        <a href="/login" class="text-decoration-none">
                            <i class="bi bi-arrow-left me-1"></i>Back to Login
                        </a>
                    </div>
                </form>

                <div class="text-center mt-4">
                    <small class="text-muted">&copy; 2026 TRIZEN Textile Management System</small>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
