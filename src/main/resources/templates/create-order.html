<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{owner.create.title}">Create Order | TRIZEN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="wrapper">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo"><i class="bi bi-boxes"></i><span>TRIZEN</span></div>
        <ul>
            <li><a href="/owner-dashboard"><i class="bi bi-speedometer2"></i> <span th:text="#{nav.dashboard}">Dashboard</span></a></li>
            <li><a href="/owner-orders"><i class="bi bi-cart-check"></i> <span th:text="#{nav.orders}">Orders</span></a></li>
            <li><a href="/create-order" class="active"><i class="bi bi-plus-circle"></i> <span th:text="#{nav.create.order}">Create Order</span></a></li>
            <li><a href="/owner-search"><i class="bi bi-search"></i> <span th:text="#{nav.search.stock}">Search Stock</span></a></li>
            <li><a href="/workers"><i class="bi bi-people-fill"></i> <span th:text="#{nav.workers}">Workers</span></a></li>
            <li><a href="/profile"><i class="bi bi-person-circle"></i> <span th:text="#{nav.profile}">Profile</span></a></li>
            <li>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-link sidebar-logout"><i class="bi bi-box-arrow-right"></i> <span th:text="#{nav.logout}">Logout</span></button>
                </form>
            </li>
        </ul>
    </aside>

    <main class="main-content">

        <div class="topbar">
            <div>
                <h2 th:text="#{owner.create.title}">Create New Order</h2>
                <small th:text="#{owner.create.sub}">Fill in the order details below.</small>
            </div>
            <div class="dropdown">
                <button class="btn btn-sm btn-outline-secondary dropdown-toggle rounded-pill fw-semibold" type="button" data-bs-toggle="dropdown">
                    <i class="bi bi-translate me-1"></i><span th:text="${#locale.language == 'ta'} ? #{lang.ta} : #{lang.en}">English</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="?lang=en" th:text="#{lang.en}">English</a></li>
                    <li><a class="dropdown-item" href="?lang=ta" th:text="#{lang.ta}">தமிழ்</a></li>
                </ul>
            </div>
        </div>

        <div class="glass-card p-4 mt-4">
            <h5 class="fw-bold mb-4" th:text="#{owner.create.details}">Order Details</h5>

            <form th:action="@{/save-order}" th:object="${order}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label fw-semibold" th:text="#{form.product}">Product Name</label>
                        <input type="text" class="form-control" th:field="*{productName}"
                               th:placeholder="#{createorder.product.ph}" placeholder="e.g. Cotton Fabric" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold" th:text="#{form.qty}">Quantity</label>
                        <input type="number" class="form-control" th:field="*{quantity}"
                               th:placeholder="#{createorder.qty.ph}" placeholder="Enter quantity" min="1" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold" th:text="#{form.assign.worker}">Assign to Worker (Username)</label>
                        <input type="text" class="form-control" th:field="*{workerUsername}"
                               th:placeholder="#{createorder.worker.ph}" placeholder="Enter worker username">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold" th:text="#{form.delivery}">Expected Delivery Date</label>
                        <input type="date" class="form-control" th:field="*{expectedDeliveryDate}">
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-semibold" th:text="#{form.remarks}">Remarks</label>
                        <textarea class="form-control" th:field="*{remarks}"
                                  rows="3" th:placeholder="#{createorder.remarks.ph}" placeholder="Any special instructions..."></textarea>
                    </div>

                    <div class="col-12 d-flex justify-content-end gap-3 mt-2">
                        <a href="/owner-orders" class="btn btn-outline-secondary rounded-pill px-4">
                            <i class="bi bi-x-circle"></i> <span th:text="#{common.cancel}">Cancel</span>
                        </a>
                        <button type="reset" class="btn btn-warning rounded-pill px-4">
                            <i class="bi bi-arrow-counterclockwise"></i> <span th:text="#{common.reset}">Reset</span>
                        </button>
                        <button type="submit" class="btn btn-primary rounded-pill px-5">
                            <i class="bi bi-check-circle-fill"></i> <span th:text="#{owner.create.submit}">Create Order</span>
                        </button>
                    </div>

                </div>
            </form>
        </div>

    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
