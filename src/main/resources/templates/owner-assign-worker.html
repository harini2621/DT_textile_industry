<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{owner.assign.title}">Assign Worker | TRIZEN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div class="wrapper">

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="bi bi-boxes"></i>
                <span>TRIZEN</span>
            </div>
            <ul>
                <li><a href="/owner-dashboard"><i class="bi bi-speedometer2"></i> <span th:text="#{nav.dashboard}">Dashboard</span></a></li>
                <li><a href="/owner-search"><i class="bi bi-search"></i> <span th:text="#{nav.search.stock}">Search Stock</span></a></li>
                <li><a href="/owner-orders"><i class="bi bi-cart-check-fill"></i> <span th:text="#{nav.orders}">Orders</span></a></li>
                <li><a href="/owner/production-tracking" class="active"><i class="bi bi-diagram-3-fill"></i> <span th:text="#{nav.production}">Production</span></a></li>
                <li><a href="/owner/payment-tracking"><i class="bi bi-cash-stack"></i> <span th:text="#{nav.payments}">Payments</span></a></li>
                <li><a href="/workers"><i class="bi bi-people-fill"></i> <span th:text="#{nav.workers}">Workers</span></a></li>
                <li><a href="/reports"><i class="bi bi-bar-chart-fill"></i> <span th:text="#{nav.reports}">Reports</span></a></li>
                <li><a href="/profile"><i class="bi bi-person-circle"></i> <span th:text="#{nav.profile}">Profile</span></a></li>
                <li>
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn btn-link sidebar-logout">
                            <i class="bi bi-box-arrow-right"></i> <span th:text="#{nav.logout}">Logout</span>
                        </button>
                    </form>
                </li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">

            <div class="topbar">
                <div>
                    <h2 th:text="#{owner.assign.title}">Assign Worker</h2>
                    <small><a href="/owner/production-tracking" th:text="#{owner.track.page.title}">Production Tracking</a> &raquo; <span th:text="#{owner.assign.title}">Assign Worker</span></small>
                </div>
                <div class="dropdown">
                    <button class="btn btn-sm btn-outline-secondary dropdown-toggle rounded-pill fw-semibold" type="button" data-bs-toggle="dropdown">
                        <i class="bi bi-translate me-1"></i><span th:text="${#locale.language == 'ta'} ? #{lang.ta} : #{lang.en}">English</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="?lang=en" th:text="#{lang.en}">English</a></li>
                        <li><a class="dropdown-item" href="?lang=ta" th:text="#{lang.ta}">தமிழ்</a></li>
                    </ul>
                </div>
            </div>

            <div th:if="${success}" class="alert alert-success alert-dismissible fade show mx-1" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mx-1" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="glass-card p-4 mx-1">
                <h5 class="fw-bold mb-3">
                    <i class="bi bi-person-check-fill text-primary me-2"></i>
                    <span th:text="#{assign.batch}">Batch:</span> <span th:text="${batch.orderNumber}">BATCH-1</span>
                </h5>

                <div class="row mb-4">
                    <div class="col-md-4">
                        <div class="border rounded p-2">
                            <small class="text-muted d-block" th:text="#{assign.product}">Product</small>
                            <strong th:text="${batch.productName}">Product</strong>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="border rounded p-2">
                            <small class="text-muted d-block" th:text="#{assign.qty}">Quantity</small>
                            <strong th:text="${batch.quantity}">0</strong>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="border rounded p-2">
                            <small class="text-muted d-block" th:text="#{assign.stage}">Current Stage</small>
                            <strong
                                th:text="${batch.currentStage != null ? (#messages.msgOrNull('stage.' + #strings.toLowerCase(batch.currentStage)) ?: batch.currentStage) : #messages.msg('stage.not.started')}">-</strong>
                        </div>
                    </div>
                </div>

                <form th:action="@{/owner/production-tracking/assign-worker}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <input type="hidden" name="batchId" th:value="${batch.orderId}" />

                    <div class="mb-3">
                        <label class="form-label fw-semibold"><span th:text="#{owner.assign.select}">Select Worker</span> <span class="text-danger">*</span></label>
                        <select name="workerUsername" class="form-select" required>
                            <option value="" th:text="#{assign.select.placeholder}">-- Select Worker --</option>
                            <option th:each="w : ${workers}" th:value="${w.workerName}"
                                th:text="${w.workerName + ' (' + w.skill + ' - ' + w.availability + ')'}"
                                th:selected="${w.workerName == batch.assignedWorker}">Worker</option>
                        </select>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary rounded-pill">
                            <i class="bi bi-person-plus-fill"></i> <span th:text="#{owner.assign.submit}">Assign Worker</span>
                        </button>
                        <a href="/owner/production-tracking" class="btn btn-outline-secondary rounded-pill">
                            <i class="bi bi-arrow-left"></i> <span th:text="#{owner.assign.back}">Back to Production</span>
                        </a>
                    </div>
                </form>
            </div>

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
