<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{owner.addw.title}">Add Worker | TRIZEN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div class="wrapper">

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="bi bi-boxes"></i>
                <span>TRIZEN</span>
            </div>
            <ul>
                <li><a href="/owner-dashboard"><i class="bi bi-speedometer2"></i> <span th:text="#{nav.dashboard}">Dashboard</span></a></li>
                <li><a href="/owner-search"><i class="bi bi-search"></i> <span th:text="#{nav.search.stock}">Search Stock</span></a></li>
                <li><a href="/owner-orders"><i class="bi bi-cart-check-fill"></i> <span th:text="#{nav.orders}">Orders</span></a></li>
                <li><a href="/owner/production-tracking"><i class="bi bi-diagram-3-fill"></i> <span th:text="#{nav.production}">Production</span></a></li>
                <li><a href="/owner/payment-tracking"><i class="bi bi-cash-stack"></i> <span th:text="#{nav.payments}">Payments</span></a></li>
                <li><a href="/workers" class="active"><i class="bi bi-people-fill"></i> <span th:text="#{nav.workers}">Workers</span></a></li>
                <li><a href="/reports"><i class="bi bi-bar-chart-fill"></i> <span th:text="#{nav.reports}">Reports</span></a></li>
                <li><a href="/profile"><i class="bi bi-person-circle"></i> <span th:text="#{nav.profile}">Profile</span></a></li>
                <li>
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn btn-link sidebar-logout">
                            <i class="bi bi-box-arrow-right"></i> <span th:text="#{nav.logout}">Logout</span>
                        </button>
                    </form>
                </li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">

            <div class="topbar">
                <div>
                    <h2 th:text="#{owner.addw.title}">Add Worker</h2>
                    <small><a href="/owner-dashboard" th:text="#{nav.dashboard}">Dashboard</a> &raquo; <span th:text="#{owner.addw.title}">Add Worker</span></small>
                </div>
                <a href="/workers" class="btn btn-outline-primary rounded-pill">
                    <i class="bi bi-arrow-left"></i> <span th:text="#{owner.addw.back}">Back to Workers</span>
                </a>
                <div class="dropdown">
                    <button class="btn btn-sm btn-outline-secondary dropdown-toggle rounded-pill fw-semibold" type="button" data-bs-toggle="dropdown">
                        <i class="bi bi-translate me-1"></i><span th:text="${#locale.language == 'ta'} ? #{lang.ta} : #{lang.en}">English</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="?lang=en" th:text="#{lang.en}">English</a></li>
                        <li><a class="dropdown-item" href="?lang=ta" th:text="#{lang.ta}">தமிழ்</a></li>
                    </ul>
                </div>
            </div>

            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mx-1" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="glass-card p-4">
                        <h5 class="fw-bold mb-4"><i class="bi bi-person-plus-fill text-primary me-2"></i><span th:text="#{owner.addw.details}">Worker Details</span>
                        </h5>
                        <form th:action="@{/owner/add-worker}" th:object="${worker}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label"><span th:text="#{workers.col.name}">Worker Name</span> <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                                        <input type="text" class="form-control" th:field="*{workerName}"
                                               th:placeholder="#{addworker.name.ph}" placeholder="e.g. Ramesh Kumar" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label"><span th:text="#{workers.col.skill}">Skill</span> <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-tools"></i></span>
                                        <input type="text" class="form-control" th:field="*{skill}"
                                               th:placeholder="#{addworker.skill.ph}" placeholder="e.g. Stitching, Dyeing" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label"><span th:text="#{workers.col.department}">Department</span> <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-building"></i></span>
                                        <input type="text" class="form-control" th:field="*{department}"
                                               th:placeholder="#{addworker.dept.ph}" placeholder="e.g. Production Floor" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label"><span th:text="#{workers.col.phone}">Phone Number</span> <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                                        <input type="text" class="form-control" th:field="*{phoneNumber}"
                                               th:placeholder="#{addworker.phone.ph}" placeholder="e.g. 9876543210" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" th:text="#{workers.col.availability}">Availability</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-check2-circle"></i></span>
                                        <select class="form-select" th:field="*{availability}">
                                            <option value="Available" th:text="#{workers.availability.available}">Available</option>
                                            <option value="Busy" th:text="#{workers.availability.busy}">Busy</option>
                                            <option value="On Leave" th:text="#{workers.availability.on.leave}">On Leave</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex gap-2 mt-4">
                                <button type="submit" class="btn btn-primary rounded-pill">
                                    <i class="bi bi-save-fill me-1"></i> <span th:text="#{owner.addw.save}">Save Worker</span>
                                </button>
                                <a href="/workers" class="btn btn-outline-secondary rounded-pill" th:text="#{owner.addw.cancel}">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
