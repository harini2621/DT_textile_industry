<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Register | TRIZEN</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>

        body{
            font-family:Poppins,sans-serif;
            background:linear-gradient(135deg,#0f172a,#2563eb,#06b6d4);
            min-height:100vh;
        }

        .register-card{
            background:rgba(255,255,255,.95);
            border-radius:30px;
            padding:45px;
            box-shadow:0 25px 60px rgba(0,0,0,.25);
            width:100%;
            max-width:520px;
        }

        .left-panel{
            color:white;
        }

        .left-panel img{
            width:100%;
            border-radius:25px;
            margin-top:30px;
            box-shadow:0 20px 50px rgba(0,0,0,.3);
        }

        .form-control,
        .form-select{
            height:55px;
            border-radius:15px;
        }

        .btn-register{
            height:55px;
            border-radius:15px;
            font-size:18px;
            font-weight:600;
        }

    </style>

</head>

<body>

<div class="container-fluid">

<div class="row min-vh-100 align-items-center">

<div class="col-lg-6 d-none d-lg-flex justify-content-center">

<div class="left-panel text-center">

<h1 class="display-2 fw-bold">
TRIZEN
</h1>

<h3 class="mt-3">
Smart Textile Management System
</h3>

<p class="lead mt-4">
Create your account and manage textile production efficiently.
</p>

<img src="https://images.unsplash.com/photo-1520607162513-77705c0f0d4a?w=1000"
     alt="TRIZEN">

</div>

</div>

<div class="col-lg-6 d-flex justify-content-center">

<div class="register-card">

<div class="text-center mb-4">

<i class="bi bi-person-plus-fill display-2 text-primary"></i>

<h2 class="fw-bold mt-3">
Create Account
</h2>

<p class="text-muted">
Register to access TRIZEN
</p>

</div>

<form th:action="@{/register}" method="post">

<div class="mb-3">

<label class="form-label fw-semibold">
Full Name
</label>

<input
type="text"
name="fullName"
class="form-control"
placeholder="Enter full name"
required>

</div>

<div class="mb-3">

<label class="form-label fw-semibold">
Email
</label>

<input
type="email"
name="email"
class="form-control"
placeholder="Enter email"
required>

</div>

<div class="mb-3">

<label class="form-label fw-semibold">
Username
</label>

<input
type="text"
name="username"
class="form-control"
placeholder="Choose username"
required>

</div>

<div class="mb-3">

<label class="form-label fw-semibold">
Password
</label>

<input
type="password"
name="password"
class="form-control"
placeholder="Enter password"
required>

</div>

<div class="mb-4">

<label class="form-label fw-semibold">
Role
</label>

<select
name="role"
class="form-select"
required>

<option value="">Select Role</option>

<option value="OWNER">Owner</option>

<option value="WORKER">Worker</option>

</select>

</div>

<button
type="submit"
class="btn btn-primary btn-register w-100">

<i class="bi bi-person-plus-fill"></i>

Register

</button>

<div class="text-center mt-4">

Already have an account?

<a href="/login"
class="fw-bold text-decoration-none">

Login

</a>

</div>

</form>

<hr>

<div class="text-center text-muted">

© 2026 TRIZEN Textile Management System

</div>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
