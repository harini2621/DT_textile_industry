<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{admin.logs.page.title}">Activity Logs | TRIZEN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div class="wrapper">

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="bi bi-shield-lock-fill"></i>
                <span>TRIZEN</span>
            </div>
            <ul>
                <li><a href="/admin/dashboard"><i class="bi bi-speedometer2"></i> <span th:text="#{nav.dashboard}">Dashboard</span></a></li>
                <li><a href="/admin/users"><i class="bi bi-person-check-fill"></i> <span th:text="#{nav.user.approval}">User Approval</span></a></li>
                <li><a href="/admin/activity-logs" class="active"><i class="bi bi-clock-history"></i> <span th:text="#{nav.activity.logs}">Activity Logs</span></a>
                </li>
                <li>
                    <a href="/admin/notifications">
                        <i class="bi bi-bell-fill"></i> <span th:text="#{nav.notifications}">Notifications</span>
                        <span class="badge bg-danger ms-1" th:if="${unreadNotifications > 0}"
                            th:text="${unreadNotifications}">0</span>
                    </a>
                </li>
                <li><a href="/profile"><i class="bi bi-person-circle"></i> <span th:text="#{nav.profile}">Profile</span></a></li>
                <li>
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn btn-link sidebar-logout">
                            <i class="bi bi-box-arrow-right"></i> <span th:text="#{nav.logout}">Logout</span>
                        </button>
                    </form>
                </li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">

            <div class="topbar">
                <div>
                    <h2 th:text="#{admin.activity.title}">Activity Logs</h2>
                    <small th:text="#{admin.activity.subtitle}">Audit trail of important actions across the system.</small>
                </div>
                <span class="badge bg-primary fs-6">
                    <i class="bi bi-list-check"></i>
                    <span th:text="${totalLogs}">0</span> <span th:text="#{admin.activity.total}">Total</span>
                </span>
                <div class="dropdown">
                    <button class="btn btn-sm btn-outline-secondary dropdown-toggle rounded-pill fw-semibold" type="button" data-bs-toggle="dropdown">
                        <i class="bi bi-translate me-1"></i><span th:text="${#locale.language == 'ta'} ? #{lang.ta} : #{lang.en}">English</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="?lang=en" th:text="#{lang.en}">English</a></li>
                        <li><a class="dropdown-item" href="?lang=ta" th:text="#{lang.ta}">தமிழ்</a></li>
                    </ul>
                </div>
            </div>

            <!-- Filter -->
            <div class="glass-card p-4">
                <form th:action="@{/admin/activity-logs}" method="get" class="row g-2 align-items-end">
                    <div class="col-md-4">
                        <label class="form-label fw-semibold" th:text="#{admin.activity.filter}">Filter by Action</label>
                        <select class="form-select" name="action">
                            <option value="" th:text="#{admin.activity.allActions}">All Actions</option>
                            <option value="USER_REGISTRATION" th:selected="${selectedAction == 'USER_REGISTRATION'}" th:text="#{admin.act.registration}">
                                User Registration</option>
                            <option value="USER_APPROVED" th:selected="${selectedAction == 'USER_APPROVED'}" th:text="#{admin.act.approved}">User
                                Approval</option>
                            <option value="USER_REJECTED" th:selected="${selectedAction == 'USER_REJECTED'}" th:text="#{admin.act.rejected}">User
                                Rejection</option>
                            <option value="LOGIN" th:selected="${selectedAction == 'LOGIN'}" th:text="#{admin.act.login}">Login</option>
                            <option value="PASSWORD_CHANGE" th:selected="${selectedAction == 'PASSWORD_CHANGE'}" th:text="#{admin.act.password}">
                                Password Change</option>
                            <option value="ORDER_CREATION" th:selected="${selectedAction == 'ORDER_CREATION'}" th:text="#{admin.act.order}">Order
                                Creation</option>
                            <option value="TASK_ASSIGNMENT" th:selected="${selectedAction == 'TASK_ASSIGNMENT'}" th:text="#{admin.act.task}">Task
                                Assignment</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <button type="submit" class="btn btn-primary rounded-pill">
                            <i class="bi bi-funnel-fill"></i> <span th:text="#{admin.activity.apply}">Apply Filter</span>
                        </button>
                        <a href="/admin/activity-logs" class="btn btn-outline-secondary rounded-pill" th:text="#{admin.activity.reset}">Reset</a>
                    </div>
                </form>
            </div>

            <!-- Logs Table -->
            <div class="glass-card p-4 mt-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th th:text="#{table.col.num}">#</th>
                                <th th:text="#{admin.activity.col.action}">Action</th>
                                <th th:text="#{admin.activity.col.performedBy}">Performed By</th>
                                <th th:text="#{admin.activity.col.details}">Details</th>
                                <th th:text="#{admin.activity.col.timestamp}">Timestamp</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="log : ${logs}">
                                <td th:text="${log.logId}"></td>
                                <td><span class="badge bg-info text-dark" th:text="${#messages.msgOrNull('admin.action.' + #strings.toLowerCase(log.action)) ?: log.action}">ACTION</span></td>
                                <td th:text="${log.performedBy != null ? log.performedBy : '-'}"></td>
                                <td th:text="${log.details}"></td>
                                <td th:text="${log.timestamp}"></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(logs)}">
                                <td colspan="5" class="text-center text-muted py-5">
                                    <i class="bi bi-clock-history display-4 d-block mb-2"></i>
                                    <span th:text="#{admin.activity.empty}">No activity logs found.</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
