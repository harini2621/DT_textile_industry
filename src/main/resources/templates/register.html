<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | TRIZEN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-page">

<div class="container-fluid">
    <div class="row min-vh-100">

        <!-- Left Panel -->
        <div class="col-lg-6 d-none d-lg-flex align-items-center justify-content-center login-left-panel">
            <div class="text-center text-white px-5">
                <i class="bi bi-boxes display-1 mb-3"></i>
                <h1 class="display-4 fw-bold">TRIZEN</h1>
                <h4 class="mt-2">Smart Textile Management System</h4>
                <p class="lead mt-3 opacity-75">Create your account and manage textile production efficiently.</p>
                <img src="https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=800"
                     class="img-fluid rounded-4 shadow-lg mt-4" alt="Textile" style="max-height:300px;object-fit:cover;">
            </div>
        </div>

        <!-- Register Card -->
        <div class="col-lg-6 d-flex align-items-center justify-content-center bg-white">
            <div class="w-100 px-4 px-md-5" style="max-width:520px;">

                <div class="text-center mb-4">
                    <i class="bi bi-person-plus-fill display-3 text-primary"></i>
                    <h2 class="fw-bold mt-2">Create Account</h2>
                    <p class="text-muted">Register to access TRIZEN</p>
                </div>

                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <form th:action="@{/register}" th:object="${user}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                            <input type="text" class="form-control" th:field="*{fullName}"
                                   placeholder="Enter full name" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                            <input type="email" class="form-control" th:field="*{email}"
                                   placeholder="Enter email" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-at"></i></span>
                            <input type="text" class="form-control" th:field="*{username}"
                                   placeholder="Choose username" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" class="form-control" th:field="*{password}"
                                   placeholder="Enter password (min 6 chars)" required minlength="6">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Role</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-shield-fill"></i></span>
                            <select class="form-select" th:field="*{role}" required>
                                <option value="">Select Role</option>
                                <option value="OWNER">Owner</option>
                                <option value="WORKER">Worker</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-semibold">
                            <i class="bi bi-person-plus-fill me-2"></i>Register
                        </button>
                    </div>

                    <div class="text-center">
                        <span class="text-muted">Already have an account?</span>
                        <a href="/login" class="fw-bold text-decoration-none ms-1">Login</a>
                    </div>
                </form>

                <div class="text-center mt-4">
                    <small class="text-muted">&copy; 2026 TRIZEN Textile Management System</small>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
