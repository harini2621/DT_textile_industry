<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Create Order | TRIZEN</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

<div class="wrapper">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">
            <i class="bi bi-boxes"></i>
            <span>TRIZEN</span>
        </div>

        <ul>

            <li><a href="/owner-dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
            <li><a href="/owner-orders"><i class="bi bi-cart-check"></i> Orders</a></li>
            <li><a href="/create-order" class="active"><i class="bi bi-plus-circle"></i> Create Order</a></li>
            <li><a href="/owner-search"><i class="bi bi-search"></i> Search Stock</a></li>
            <li><a href="/login"><i class="bi bi-box-arrow-right"></i> Logout</a></li>

        </ul>

    </aside>

    <!-- Main Content -->

    <main class="main-content">

        <div class="topbar">

            <div>

                <h2>Create New Order</h2>

                <small>Fill customer and textile order details.</small>

            </div>

        </div>

        <div class="glass-card p-4 mt-4">

            <h4 class="mb-4">Customer Information</h4>

            <form>

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Customer Name</label>
                        <input type="text" class="form-control" placeholder="Enter customer name">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Company Name</label>
                        <input type="text" class="form-control" placeholder="Enter company name">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" placeholder="Enter phone number">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" placeholder="Enter email">
                    </div>

                    <div class="col-12">
                        <label class="form-label">Address</label>
                        <textarea class="form-control" rows="3" placeholder="Enter address"></textarea>
                    </div>

                                  <hr class="my-4">

                    <h4 class="mb-4">Order Details</h4>

                    <div class="col-md-6">
                        <label class="form-label">Fabric Type</label>
                        <select class="form-select">
                            <option selected>Select Fabric</option>
                            <option>Cotton</option>
                            <option>Silk</option>
                            <option>Denim</option>
                            <option>Polyester</option>
                            <option>Linen</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Fabric Color</label>
                        <input type="text"
                               class="form-control"
                               placeholder="e.g. White">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Quantity (Meters)</label>
                        <input type="number"
                               class="form-control"
                               placeholder="Enter quantity">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Price (₹)</label>
                        <input type="number"
                               class="form-control"
                               placeholder="Enter price">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Order Date</label>
                        <input type="date"
                               class="form-control">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Delivery Date</label>
                        <input type="date"
                               class="form-control">
                    </div>

                    <div class="col-12">
                        <label class="form-label">Special Instructions</label>
                        <textarea class="form-control"
                                  rows="4"
                                  placeholder="Enter any special requirements"></textarea>
                    </div>
                    
                                   <hr class="my-4">

                    <div class="d-flex justify-content-end gap-3">

                        <a href="/owner-orders"
                           class="btn btn-outline-secondary rounded-pill px-4">

                            <i class="bi bi-x-circle"></i>

                            Cancel

                        </a>

                        <button type="reset"
                                class="btn btn-warning rounded-pill px-4">

                            <i class="bi bi-arrow-counterclockwise"></i>

                            Reset

                        </button>

                        <button type="submit"
                                class="btn btn-primary rounded-pill px-5">

                            <i class="bi bi-check-circle-fill"></i>

                            Create Order

                        </button>

                    </div>

                </div>

            </form>

        </div>

    </main>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom JS -->
<script th:src="@{/js/script.js}"></script>

</body>

</html>
