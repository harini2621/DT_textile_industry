<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{admin.notif.page.title}">Notifications | TRIZEN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div class="wrapper">

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="bi bi-shield-lock-fill"></i>
                <span>TRIZEN</span>
            </div>
            <ul>
                <li><a href="/admin/dashboard"><i class="bi bi-speedometer2"></i> <span th:text="#{nav.dashboard}">Dashboard</span></a></li>
                <li><a href="/admin/users"><i class="bi bi-person-check-fill"></i> <span th:text="#{nav.user.approval}">User Approval</span></a></li>
                <li><a href="/admin/activity-logs"><i class="bi bi-clock-history"></i> <span th:text="#{nav.activity.logs}">Activity Logs</span></a></li>
                <li>
                    <a href="/admin/notifications" class="active">
                        <i class="bi bi-bell-fill"></i> <span th:text="#{nav.notifications}">Notifications</span>
                        <span class="badge bg-danger ms-1" th:if="${unreadNotifications > 0}"
                            th:text="${unreadNotifications}">0</span>
                    </a>
                </li>
                <li><a href="/profile"><i class="bi bi-person-circle"></i> <span th:text="#{nav.profile}">Profile</span></a></li>
                <li>
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn btn-link sidebar-logout">
                            <i class="bi bi-box-arrow-right"></i> <span th:text="#{nav.logout}">Logout</span>
                        </button>
                    </form>
                </li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">

            <div class="topbar">
                <div>
                    <h2 th:text="#{admin.notifications.title}">Notifications</h2>
                    <small th:text="#{admin.notifications.subtitle}">System notifications and alerts.</small>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <span class="badge bg-danger fs-6" th:if="${unreadNotifications > 0}">
                        <i class="bi bi-envelope-fill"></i>
                        <span th:text="${unreadNotifications}">0</span> <span th:text="#{admin.notifications.unread}">Unread</span>
                    </span>
                    <span class="badge bg-success fs-6" th:if="${unreadNotifications == 0}">
                        <i class="bi bi-check2-all"></i> <span th:text="#{admin.notifications.allRead}">All Read</span>
                    </span>
                    <form th:action="@{/admin/notifications/read-all}" method="post" class="d-inline"
                        th:if="${unreadNotifications > 0}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn btn-outline-primary rounded-pill btn-sm">
                            <i class="bi bi-check2-all"></i> <span th:text="#{admin.notifications.markAllRead}">Mark All as Read</span>
                        </button>
                    </form>
                </div>
                <div class="dropdown">
                    <button class="btn btn-sm btn-outline-secondary dropdown-toggle rounded-pill fw-semibold" type="button" data-bs-toggle="dropdown">
                        <i class="bi bi-translate me-1"></i><span th:text="${#locale.language == 'ta'} ? #{lang.ta} : #{lang.en}">English</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="?lang=en" th:text="#{lang.en}">English</a></li>
                        <li><a class="dropdown-item" href="?lang=ta" th:text="#{lang.ta}">தமிழ்</a></li>
                    </ul>
                </div>
            </div>

            <div th:if="${success}" class="alert alert-success alert-dismissible fade show mx-1" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i><span th:text="${#messages.msgOrNull(success)} ?: ${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Notification List -->
            <div class="glass-card p-4">
                <ul class="list-group list-group-flush">
                    <li class="list-group-item d-flex justify-content-between align-items-start py-3"
                        th:each="n : ${notifications}" th:classappend="${n.readStatus} ? '' : 'bg-light'">
                        <div class="d-flex align-items-start">
                            <i class="bi fs-4 me-3"
                                th:classappend="${n.readStatus} ? 'bi-envelope-open text-secondary' : 'bi-envelope-fill text-primary'"></i>
                            <div>
                                <h6 class="fw-bold mb-1" th:text="${n.title}">Title</h6>
                                <p class="text-muted mb-1" th:text="${n.message}">Message</p>
                                <small class="text-muted">
                                    <i class="bi bi-clock me-1"></i><span th:text="${n.createdAt}">date</span>
                                </small>
                            </div>
                        </div>
                        <div class="text-end">
                            <span class="badge bg-danger mb-2" th:if="${!n.readStatus}" th:text="#{status.unread}">Unread</span>
                            <form th:action="@{/admin/notifications/read}" method="post" th:if="${!n.readStatus}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <input type="hidden" name="notificationId" th:value="${n.notificationId}" />
                                <button type="submit" class="btn btn-sm btn-outline-primary rounded-pill">
                                    <i class="bi bi-check2"></i> <span th:text="#{admin.notifications.markRead}">Mark as Read</span>
                                </button>
                            </form>
                        </div>
                    </li>
                    <li class="list-group-item text-center text-muted py-5" th:if="${#lists.isEmpty(notifications)}">
                        <i class="bi bi-bell-slash display-4 d-block mb-2"></i>
                        <span th:text="#{admin.notifications.empty}">No notifications yet.</span>
                    </li>
                </ul>
            </div>

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
