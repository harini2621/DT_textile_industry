<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Order | TRIZEN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="wrapper">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo"><i class="bi bi-boxes"></i><span>TRIZEN</span></div>
        <ul>
            <li><a href="/owner-dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
            <li><a href="/owner-orders"><i class="bi bi-cart-check"></i> Orders</a></li>
            <li><a href="/create-order" class="active"><i class="bi bi-plus-circle"></i> Create Order</a></li>
            <li><a href="/owner-search"><i class="bi bi-search"></i> Search Stock</a></li>
            <li><a href="/workers"><i class="bi bi-people-fill"></i> Workers</a></li>
            <li><a href="/profile"><i class="bi bi-person-circle"></i> Profile</a></li>
            <li>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-link sidebar-logout"><i class="bi bi-box-arrow-right"></i> Logout</button>
                </form>
            </li>
        </ul>
    </aside>

    <main class="main-content">

        <div class="topbar">
            <div>
                <h2>Create New Order</h2>
                <small>Fill in the order details below.</small>
            </div>
        </div>

        <div class="glass-card p-4 mt-4">
            <h5 class="fw-bold mb-4">Order Details</h5>

            <form th:action="@{/save-order}" th:object="${order}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Product Name</label>
                        <input type="text" class="form-control" th:field="*{productName}"
                               placeholder="e.g. Cotton Fabric" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Quantity</label>
                        <input type="number" class="form-control" th:field="*{quantity}"
                               placeholder="Enter quantity" min="1" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Assign to Worker (Username)</label>
                        <input type="text" class="form-control" th:field="*{workerUsername}"
                               placeholder="Enter worker username">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Expected Delivery Date</label>
                        <input type="date" class="form-control" th:field="*{expectedDeliveryDate}">
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-semibold">Remarks</label>
                        <textarea class="form-control" th:field="*{remarks}"
                                  rows="3" placeholder="Any special instructions..."></textarea>
                    </div>

                    <div class="col-12 d-flex justify-content-end gap-3 mt-2">
                        <a href="/owner-orders" class="btn btn-outline-secondary rounded-pill px-4">
                            <i class="bi bi-x-circle"></i> Cancel
                        </a>
                        <button type="reset" class="btn btn-warning rounded-pill px-4">
                            <i class="bi bi-arrow-counterclockwise"></i> Reset
                        </button>
                        <button type="submit" class="btn btn-primary rounded-pill px-5">
                            <i class="bi bi-check-circle-fill"></i> Create Order
                        </button>
                    </div>

                </div>
            </form>
        </div>

    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
