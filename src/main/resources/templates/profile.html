<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>My Profile | TRIZEN</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

<div class="wrapper">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">
            <i class="bi bi-boxes"></i>
            <span>TRIZEN</span>
        </div>

        <ul>

            <li><a href="/owner-dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
            <li><a href="/owner-orders"><i class="bi bi-cart-check"></i> Orders</a></li>
            <li><a href="/owner-search"><i class="bi bi-search"></i> Search Stock</a></li>
            <li><a href="/profile" class="active"><i class="bi bi-person-circle"></i> Profile</a></li>
            <li><a href="/login"><i class="bi bi-box-arrow-right"></i> Logout</a></li>

        </ul>

    </aside>

    <!-- Main Content -->

    <main class="main-content">

        <div class="topbar">

            <div>

                <h2>My Profile</h2>

                <small>Manage your account information and settings.</small>

            </div>

        </div>

        <div class="glass-card p-4 mt-4">

            <div class="text-center mb-4">

                <i class="bi bi-person-circle display-1 text-primary"></i>

                <h3 class="mt-3">Owner Name</h3>

                <p class="text-muted">Textile Company Owner</p>

            </div>

            <form>

                <div class="row g-3">

                    <div class="col-md-6">

                        <label class="form-label">Full Name</label>

                        <input type="text"
                               class="form-control"
                               value="Owner Name">

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">Email</label>

                        <input type="email"
                               class="form-control"
                               value="owner@trizen.com">

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">Phone Number</label>

                        <input type="text"
                               class="form-control"
                               value="+91 9876543210">

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">Role</label>

                        <input type="text"
                               class="form-control"
                               value="Owner"
                               readonly>

                    </div>

                                        <div class="col-12">

                        <label class="form-label">Address</label>

                        <textarea class="form-control"
                                  rows="3">Coimbatore, Tamil Nadu</textarea>

                    </div>

                    <hr class="my-4">

                    <h4 class="mb-3">Change Password</h4>

                    <div class="col-md-6">

                        <label class="form-label">Current Password</label>

                        <input type="password"
                               class="form-control"
                               placeholder="Enter current password">

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">New Password</label>

                        <input type="password"
                               class="form-control"
                               placeholder="Enter new password">

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">Confirm Password</label>

                        <input type="password"
                               class="form-control"
                               placeholder="Confirm new password">

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">Account Status</label>

                        <input type="text"
                               class="form-control"
                               value="Active"
                               readonly>

                    </div>

                                 <hr class="my-4">

                    <div class="d-flex justify-content-end gap-3">

                        <button type="reset"
                                class="btn btn-outline-secondary rounded-pill px-4">

                            <i class="bi bi-arrow-counterclockwise"></i>

                            Reset

                        </button>

                        <button type="submit"
                                class="btn btn-primary rounded-pill px-5">

                            <i class="bi bi-check-circle-fill"></i>

                            Save Changes

                        </button>

                    </div>

                </div>

            </form>

        </div>

    </main>

</div>

<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom JS -->

<script th:src="@{/js/script.js}"></script>

</body>

</html>
